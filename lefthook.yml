# Check-only on pre-commit: an auto-fix rewrites staged content at commit time,
# so the committed bytes would differ from what was reviewed. A failing check
# tells the author to run `pnpm check:fix` and stage the result.
pre-commit:
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: pnpm exec vp lint {staged_files}
    format:
      glob: "*.{js,ts,jsx,tsx,json,css,yml,yaml}"
      run: pnpm exec vp fmt --check {staged_files}
pre-push:
  commands:
    check:
      run: pnpm check
    test:
      run: pnpm test
