# `minimumReleaseAge` delays installing a version published less than 7 days
# ago, which is the window a compromised release is usually caught and
# unpublished in. It reads from pnpm 10.16 on. `trustPolicy` refuses an update
# whose trust evidence is weaker than the installed version's, and it reads
# from pnpm 10.21 on, so `packageManager` above has to name at least that
# version for it to do anything.
minimumReleaseAge: 10080
# react-doctor → eslint-plugin-react-hooks → @babel/helper-compilation-targets
# → browserslist requires baseline-browser-mapping@^2.11.23. The only release
# satisfying that range is 2.11.24, published 2026-09-16 (within the 7-day
# window). This package is browser-compatibility data, not executable runtime
# code, so the supply-chain risk of the bypass here is low.
minimumReleaseAgeExclude:
  - baseline-browser-mapping
trustPolicy: no-downgrade
